yolo_detector:
  ros__parameters:
    use_sim_time: true
    image_topic: /oakd/rgb/preview/image_raw
    annotated_topic: /yolo/annotated_image
    weights: models/yolov8n.pt
    confidence: 0.40
    image_size: 640
    inference_rate: 3.0
    device: auto
    cpu_threads: 2
    log_period: 5.0
    image_timeout: 5.0
    evidence_dir: evidence/runtime
